components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 JWT，支持 user / platform / service audience
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 服务账号 API Key

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    TenantHeader:
      name: X-Tenant-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: 租户作用域提示，必须与 Token/授权范围一致
    OrganizationHeader:
      name: X-Organization-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: 乐观锁 ETag
    CurrentSessionId:
      name: current_session_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationMembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceAccountId:
      name: serviceAccountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApiKeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TransferId:
      name: transferId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GrantId:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ParamKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_.-]{0,127}$'
    ExtensionName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{0,63}$'

  responses:
    BadRequest:
      description: invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: authentication required or token stale
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: permission denied
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: not found or not visible
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: state or uniqueness conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: optimistic lock mismatch
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: rate limited
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServerError:
      description: internal error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - INVALID_CREDENTIALS
            - ACCOUNT_LOCKED
            - PERMISSION_VERSION_STALE
            - CONTACT_NOT_VERIFIED
            - STEP_UP_REQUIRED
            - API_KEY_INVALID
            - OAUTH_INVALID_CLIENT
            - PERMISSION_DENIED
            - TENANT_CONTEXT_REQUIRED
            - NO_ACTIVE_MEMBERSHIP
            - TENANT_FROZEN
            - TENANT_CLOSED
            - ORGANIZATION_FROZEN
            - ORGANIZATION_ARCHIVED
            - PERMISSION_ESCALATION_DENIED
            - RESOURCE_NOT_FOUND
            - VALIDATION_FAILED
            - IDEMPOTENCY_CONFLICT
            - IDEMPOTENCY_IN_PROGRESS
            - IDEMPOTENCY_FAILED
            - VERSION_CONFLICT
            - CONCURRENT_MODIFICATION
            - PRECONDITION_FAILED
            - STATE_CONFLICT
            - OWNER_TRANSFER_PENDING
            - OWNER_EXISTS
            - OWNER_NOT_REMOVABLE
            - ORGANIZATION_DEPTH_EXCEEDED
            - TENANT_SLUG_EXISTS
            - MEMBERSHIP_EXISTS
            - ORGANIZATION_NAME_EXISTS
            - PENDING_REQUEST_EXISTS
            - NOT_SUPPORTED
            - INVITATION_INVALID
            - INVITATION_EXPIRED
            - ONE_TIME_TOKEN_INVALID
            - ONE_TIME_TOKEN_EXPIRED
            - RATE_LIMITED
            - SERVICE_UNAVAILABLE
            - INTERNAL_ERROR
          description: 稳定错误码；以 docs/20-design/error-codes-v2.0.md §3 为唯一权威清单，新增/废弃需先改目录（`errors[].code` 为字段级子码，不在此枚举内）
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        trace_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string

    PermissionVersion:
      type: object
      properties:
        u:
          type: integer
          minimum: 0
        t:
          type: integer
          minimum: 0
        m:
          type: integer
          minimum: 0
