openapi: 3.1.0
info:
  title: b_platform Core API
  version: 2.0.0
  summary: 通用业务底座平台控制面 API
  description: |
    b_platform 的核心控制面契约。

    - 用户/租户 API 前缀：`/api/v1`
    - 平台控制面 API 前缀：`/api/platform/v1`
    - 扩展 API 前缀：`/api/v1/ext/<module>`
    - 认证：JWT Bearer 或 API Key
    - 错误：RFC 9457 Problem Details 风格
    - 分页：cursor
    - 关键写操作：`Idempotency-Key`
    - 权限点通过 `x-permission` 声明，语义见权限模型 V2.0
    - 错误码以 `Problem.code` 枚举为准，权威清单见审计/事件/错误码目录（docs/20-design）
    - 一期不支持的操作（父组织变更、物理删除、组织/租户迁移等）返回 `405 NOT_SUPPORTED` Problem；因目标处于不可转换状态而被拒时返回 `409 STATE_CONFLICT`（状态机 §7.2 规则 5）

    本文档是 API 的唯一权威来源；实现变更必须先改契约。
  contact:
    name: b_platform
    url: https://platform.example.com
  license:
    name: Proprietary
servers:
  - url: https://platform.example.com
    description: Production
  - url: http://localhost:8080
    description: Local
tags:
  - name: Auth
    description: 注册、登录、刷新、验证、上下文切换
  - name: Me
    description: 当前用户
  - name: Tenant
    description: 租户内成员、角色、配置、审计
  - name: Organization
    description: 租户内组织、成员、角色、所有权
  - name: ServiceAccount
    description: 服务账号与 API Key
  - name: Webhook
    description: 租户 Webhook
  - name: Platform
    description: 平台控制面
  - name: Health
    description: 健康检查
security:
  - bearerAuth: []
  - apiKeyAuth: []
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: healthz
      summary: 进程存活
      security: []
      responses:
        '200':
          description: alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      tags: [Health]
      operationId: readyz
      summary: 就绪检查
      security: []
      responses:
        '200':
          description: ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: not ready
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /.well-known/jwks.json:
    get:
      tags: [Auth]
      operationId: getJwks
      summary: JWKS 公钥
      security: []
      responses:
        '200':
          description: JWKS
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: 注册用户
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 账号密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423':
          description: account locked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: 刷新 Token（旋转 + 重用检测）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      x-subject-authz: session-owner
      summary: 登出
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204': { description: logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: 请求密码重置
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
      responses:
        '202': { description: accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: 使用一次性令牌重置密码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204': { description: password reset }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/verify/email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: 验证邮箱
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '204': { description: verified }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/verify/phone:
    post:
      tags: [Auth]
      operationId: verifyPhone
      summary: 验证手机号
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '204': { description: verified }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/context/switch:
    post:
      tags: [Auth]
      operationId: switchContext
      x-subject-authz: self
      summary: 切换租户/组织上下文并重新签发 Access Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextSwitchRequest'
      responses:
        '200':
          description: switched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSwitchResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/auth/sessions:
    get:
      tags: [Auth]
      operationId: listSessions
      x-subject-authz: session-owner
      summary: 查看自己的会话
      parameters:
        - $ref: '#/components/parameters/CurrentSessionId'
      responses:
        '200':
          description: sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      operationId: revokeSession
      x-subject-authz: session-owner
      summary: 撤销自己的会话
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204': { description: revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/me:
    get:
      tags: [Me]
      operationId: getMe
      x-subject-authz: self
      summary: 当前用户信息
      responses:
        '200':
          description: me
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Me]
      operationId: updateMe
      x-subject-authz: self
      summary: 更新自己的资料
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdate'
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /api/v1/me/password:
    put:
      tags: [Me]
      operationId: changePassword
      x-subject-authz: self
      summary: 修改自己的密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204': { description: changed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/me/permissions:
    get:
      tags: [Me]
      operationId: getMyPermissions
      x-subject-authz: self
      summary: 当前作用域的有效权限
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OrganizationHeader'
      responses:
        '200':
          description: permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionSet'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/me/memberships:
    get:
      tags: [Me]
      operationId: listMyMemberships
      x-subject-authz: self
      summary: 我的租户/组织成员关系
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyMembershipList'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/tenant:
    get:
      tags: [Tenant]
      operationId: getTenant
      summary: 当前租户信息
      x-permission: tenant.read
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tenant]
      operationId: updateTenant
      summary: 更新租户基本信息
      x-permission: tenant.update
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdate'
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /api/v1/tenant/config:
    get:
      tags: [Tenant]
      operationId: getTenantConfig
      summary: 查看租户配置
      x-permission: tenant.config.read
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfig'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Tenant]
      operationId: updateTenantConfig
      summary: 更新租户配置
      x-permission: tenant.config.update
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantConfig'
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfig'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/tenant/members:
    get:
      tags: [Tenant]
      operationId: listTenantMembers
      summary: 租户成员列表
      x-permission: tenant.member.read
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/MembershipStatus'
      responses:
        '200':
          description: members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/tenant/members/invitations:
    post:
      tags: [Tenant]
      operationId: inviteTenantMember
      summary: 邀请租户成员
      x-permission: tenant.member.invite
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
      responses:
        '201':
          description: invited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/tenant/members/{membershipId}:
    delete:
      tags: [Tenant]
      operationId: removeTenantMember
      summary: 移除租户成员
      x-permission: tenant.member.remove
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/tenant/members/{membershipId}/suspend:
    post:
      tags: [Tenant]
      operationId: suspendTenantMember
      summary: 暂停租户成员
      x-permission: tenant.member.suspend
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/tenant/members/{membershipId}/activate:
    post:
      tags: [Tenant]
      operationId: activateTenantMember
      summary: 恢复租户成员
      x-permission: tenant.member.activate
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/tenant/members/{membershipId}/roles:
    put:
      tags: [Tenant]
      operationId: setTenantMemberRoles
      summary: 设置租户成员角色
      x-permission: tenant.role.assign
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentUpdate'
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/tenant/roles:
    get:
      tags: [Tenant]
      operationId: listTenantRoles
      summary: 租户角色列表
      x-permission: tenant.role.read
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Tenant]
      operationId: createTenantRole
      summary: 创建租户角色
      x-permission: tenant.role.manage
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/tenant/roles/{roleId}:
    get:
      tags: [Tenant]
      operationId: getTenantRole
      summary: 租户角色详情
      x-permission: tenant.role.read
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          description: role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tenant]
      operationId: updateTenantRole
      summary: 更新租户角色
      x-permission: tenant.role.manage
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RoleId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /api/v1/tenant/roles/{roleId}/permissions:
    put:
      tags: [Tenant]
      operationId: setTenantRolePermissions
      summary: 设置租户角色权限
      x-permission: tenant.role.manage
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RoleId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionsUpdate'
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/tenant/organizations:
    get:
      tags: [Tenant]
